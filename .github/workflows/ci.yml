name: Tests

# Checks the original Java project, reflection backend and Android app on master pushes/PRs.
# Tests use simulated storage/providers and local HTTP; no MySQL instance or API keys are needed.
# Paid evaluation harnesses require explicitly invoking their main() methods;
# JUnit does not invoke those methods, even when they live in a *Test.java class.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: mvn test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run the test suite
        run: mvn -B --no-transfer-progress test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  backend:
    name: Backend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUNSTATE_LIVE_SONG_TRIAL: '0'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package the backend
        working-directory: backend
        run: mvn -B --no-transfer-progress verify

      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  android:
    name: Android unit tests + debug build (Java 17)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Android unit tests and build the debug app
        working-directory: android
        run: bash ./gradlew --no-daemon ':app:testDebugUnitTest' ':app:assembleDebug' ':app:assembleDebugAndroidTest'
