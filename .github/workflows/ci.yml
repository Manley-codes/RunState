name: Tests

# Checks the original Java project, reflection backend and Android app on master pushes/PRs.
# Tests use simulated storage/providers and local HTTP; no MySQL instance or API keys are needed.
# Paid evaluation harnesses require explicitly invoking their main() methods;
# JUnit does not invoke those methods, even when they live in a *Test.java class.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    name: mvn test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run the test suite
        run: mvn -B --no-transfer-progress test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  backend:
    name: Backend tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUNSTATE_LIVE_SONG_TRIAL: '0'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test and package the backend
        working-directory: backend
        run: mvn -B --no-transfer-progress verify

      # Build locally on the runner only; no registry push or deployment.
      - name: Build the backend container
        run: docker build --tag "runstate-backend-ci:${GITHUB_SHA}" backend

      - name: Verify container startup and private storage
        shell: bash
        run: python3 backend/check-container.py "runstate-backend-ci:${GITHUB_SHA}" 2>&1 | tee backend/target/container-check.log

      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: |
            backend/target/surefire-reports/
            backend/target/container-check.log
          retention-days: 7

  android:
    name: Android unit tests + debug build (Java 17)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run Android unit tests and build the debug app
        working-directory: android
        run: bash ./gradlew --no-daemon ':app:testDebugUnitTest' ':app:assembleDebug' ':app:assembleDebugAndroidTest'

  android-release:
    name: Android release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Release APK/AAB outputs stay unsigned on the runner; this does not publish them.
      - name: Test, inspect and build the release app
        working-directory: android
        run: bash ./gradlew --no-daemon ':app:testReleaseUnitTest' ':app:lintRelease' ':app:assembleRelease' ':app:bundleRelease'

      - name: Verify public APK packaging
        shell: bash
        run: python3 android/check-public-apk.py android/app/build/outputs/apk/release/app-release-unsigned.apk 2>&1 | tee android/app/build/reports/public-apk-check.log

      - name: Download verified bundletool
        shell: bash
        env:
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          curl --fail --location --retry 2 --max-time 120 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool-all-1.18.3.jar" | sha256sum --check --strict

      - name: Verify public App Bundle packaging
        shell: bash
        run: |
          python3 android/check-public-bundle.py android/app/build/outputs/bundle/release/app-release.aab \
            --bundletool "$RUNNER_TEMP/bundletool-all-1.18.3.jar" \
            2>&1 | tee android/app/build/reports/public-bundle-check.log

      - name: Upload Android release reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-reports
          path: |
            android/app/build/reports/lint-results-release.*
            android/app/build/reports/tests/testReleaseUnitTest/
            android/app/build/test-results/testReleaseUnitTest/
            android/app/build/reports/public-apk-check.log
            android/app/build/reports/public-bundle-check.log
          retention-days: 7
