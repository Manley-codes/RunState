name: iPhone field test

on:
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'android/gradle.properties'
      - 'android/app/src/main/assets/opening/**'
      - 'android/app/src/main/assets/opening-photo-sources.json'
      - 'android/app/src/main/assets/third_party_notices.txt'
      - 'android/app/src/main/res/drawable-nodpi/opening_first_frame.webp'
      - 'android/app/src/main/res/drawable-nodpi/start_map_reference.jpg'
      - 'android/app/src/main/res/drawable/start_music_orb.jpg'
      - 'android/app/src/main/res/font/barlow_condensed_medium.ttf'
      - 'android/app/src/main/res/font/anton_regular.ttf'
  pull_request:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
      - 'android/gradle.properties'
      - 'android/app/src/main/assets/opening/**'
      - 'android/app/src/main/assets/opening-photo-sources.json'
      - 'android/app/src/main/assets/third_party_notices.txt'
      - 'android/app/src/main/res/drawable-nodpi/opening_first_frame.webp'
      - 'android/app/src/main/res/drawable-nodpi/start_map_reference.jpg'
      - 'android/app/src/main/res/drawable/start_music_orb.jpg'
      - 'android/app/src/main/res/font/barlow_condensed_medium.ttf'
      - 'android/app/src/main/res/font/anton_regular.ttf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-test:
    name: Simulator tests and personal device build
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the run flow, GPS and saved runs on iOS
        run: |
          xcodebuild -version
          xcodebuild -project RunState.xcodeproj -scheme RunState -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/RunStateTests.xcresult" test

      - name: Keep failed simulator results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RunState-iOS-test-results
          path: ${{ runner.temp }}/RunStateTests.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Build the unsigned iPhone app
        run: |
          # Both field apps use the existing public registration. The SDK performs its own authorization.
          PUBLIC_SPOTIFY_ID="$(sed -n 's/^runstate\.spotifyClientId=//p' ../android/gradle.properties | tr -d '\r')"
          if [[ -n "$PUBLIC_SPOTIFY_ID" && ! "$PUBLIC_SPOTIFY_ID" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo 'Expected a 32-character public Spotify client ID.'
            exit 1
          fi
          xcodebuild -project RunState.xcodeproj -scheme RunState -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/device-build" \
            "RUNSTATE_SPOTIFY_CLIENT_ID=$PUBLIC_SPOTIFY_ID" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/device-build/Build/Products/Release-iphoneos/RunState.app"
          test -x "$app/RunState"
          test -s "$app/Frameworks/SpotifyiOS.framework/SpotifyiOS"
          test -s "$app/Frameworks/SpotifyiOS.framework/PrivacyInfo.xcprivacy"
          test -s "$app/SpotifyNotices.txt"
          test -s "$app/Assets.car"
          test ! -e "$app/reflection-test-tone.mp3"
          test "$(plutil -extract RunStateSpotifyClientID raw -o - "$app/Info.plist")" = "$PUBLIC_SPOTIFY_ID"
          test "$(plutil -extract CFBundleSupportedPlatforms.0 raw -o - "$app/Info.plist")" = iPhoneOS
          for photo in ../android/app/src/main/assets/opening/*.webp; do
            test -s "$app/opening/$(basename "$photo")"
          done
          for file in opening_first_frame.webp start_map_reference.jpg start_music_orb.jpg barlow_condensed_medium.ttf anton_regular.ttf opening-photo-sources.json third_party_notices.txt PrivacyInfo.xcprivacy; do
            test -s "$app/$file"
          done
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$app" "$RUNNER_TEMP/package/Payload/RunState.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/RunState-field-test.ipa" Payload
          /usr/bin/unzip -tq "$RUNNER_TEMP/RunState-field-test.ipa"

      - name: Save the build for personal signing
        uses: actions/upload-artifact@v4
        with:
          name: RunState-iPhone-unsigned
          path: ${{ runner.temp }}/RunState-field-test.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Export the simulator screenshots and synthetic reflection requests
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/RunStateTests.xcresult" --output-path "$RUNNER_TEMP/ios-attachments"
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          source = temp / "ios-attachments"
          target = temp / "run-screens"
          target.mkdir()
          manifest = json.loads((source / "manifest.json").read_text())
          screens = ("RunState-PostRun", "RunState-HistoryDetail", "RunState-WrittenReflection", "RunState-NowPlaying", "RunState-SpokenReflection")
          for test in manifest:
              for item in test["attachments"]:
                  if "RunState-ReflectionRequest" in item.get("suggestedHumanReadableName", ""):
                      shutil.copyfile(source / item["exportedFileName"], temp / "iphone-test-request.json")
                  if "RunState-SpeechRequest" in item.get("suggestedHumanReadableName", ""):
                      shutil.copyfile(source / item["exportedFileName"], temp / "iphone-test-speech.json")
                  for name in screens:
                      if name in item.get("suggestedHumanReadableName", ""):
                          image = source / item["exportedFileName"]
                          if image.read_bytes()[:8] == bytes.fromhex("89504e470d0a1a0a"):
                              shutil.copyfile(image, target / (name + ".png"))
          for name in screens:
              if not (target / (name + ".png")).is_file():
                  raise SystemExit(f"Simulator screenshot missing: {name}")
          PY

      - name: Set up Java for the reflection contract check
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Send the iPhone test request to the local Java fake writer
        env:
          RUNSTATE_REFLECTION_PORT: '18787'
        run: |
          set -euo pipefail
          mvn -B --no-transfer-progress -f ../backend/pom.xml compile dependency:build-classpath \
            "-Dmdep.outputFile=$RUNNER_TEMP/iphone-test-classpath"
          java -cp "../backend/target/classes:$(cat "$RUNNER_TEMP/iphone-test-classpath")" \
            com.runstate.reflection.ReflectionBackendMain --fake > "$RUNNER_TEMP/iphone-test-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          url="http://127.0.0.1:$RUNSTATE_REFLECTION_PORT"
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 "$url/health"
          curl --fail-with-body --silent --show-error --max-time 10 -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/iphone-test-request.json" \
            "$url/api/reflections/candidates" -o "$RUNNER_TEMP/iphone-test-response.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"])
          request = json.loads((folder / "iphone-test-request.json").read_text())
          response = json.loads((folder / "iphone-test-response.json").read_text())
          assert response["requestId"] == request["requestId"] and response["runId"] == request["runId"]
          assert response["generationMode"] == "FAKE"
          assert set(response["candidates"]) == {"spent", "feeling_good", "powered_up", "no_selection"}
          assert all(text.startswith("[FAKE]") for text in response["candidates"].values())
          print("The Java backend accepted the iPhone request and returned all four test answers.")
          PY

      - name: Verify the iPhone voice request with a simulated Java speech provider
        run: |
          mvn -B --no-transfer-progress -f ../backend/pom.xml test \
            '-Dtest=ReflectionHttpServerTest#reflectionSpeechPreservesExactTextAndReturnsPrivateMp3Bytes' \
            "-Drunstate.test.iosSpeechBody=$RUNNER_TEMP/iphone-test-speech.json"

      - name: Save the simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: RunState-iPhone-screens
          path: ${{ runner.temp }}/run-screens/*.png
          if-no-files-found: error
          retention-days: 7
